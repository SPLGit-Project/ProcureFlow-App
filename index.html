<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- iOS PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProcureFlow">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167x167.png">
    
    <meta name="app-version" content="dynamic" />
    <link rel="manifest" href="/manifest.json" />
    <title>ProcureFlow</title>
    <script>
      if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
         window.location.href = window.location.href.replace('http:', 'https:');
      }
    </script>
    <script id="startup-recovery">
      // Runs before the module graph so a missing bundle can recover even when
      // React never starts. Keep authentication, preferences and drafts intact.
      (() => {
        const retryKey = 'procureflow-startup-retry';
        const hasStarted = () => Boolean(document.getElementById('root')?.hasChildNodes());
        const showRecovery = () => {
          if (hasStarted()) return;
          const root = document.getElementById('root');
          if (!root) return;
          const panel = document.createElement('div');
          panel.style.cssText = 'max-width:420px;margin:18vh auto;padding:28px;font:16px system-ui;color:#e2e8f0;background:#171315;border-radius:16px;text-align:center';
          const title = document.createElement('h1');
          title.textContent = 'ProcureFlow could not finish loading';
          title.style.fontSize = '22px';
          const message = document.createElement('p');
          message.textContent = 'Check your connection, then reload to get the latest version.';
          const button = document.createElement('button');
          button.textContent = 'Reload ProcureFlow';
          button.style.cssText = 'padding:12px 18px;background:#129DC0;border:0;border-radius:8px;font:inherit;color:#fff;cursor:pointer';
          button.onclick = () => {
            try { sessionStorage.removeItem(retryKey); } catch (_) { /* Storage may be disabled. */ }
            window.location.reload();
          };
          panel.append(title, message, button);
          root.append(panel);
        };
        window.addEventListener('error', event => {
          const script = event.target;
          if (hasStarted() || !(script instanceof HTMLScriptElement) || script.type !== 'module') return;
          const source = new URL(script.src, window.location.href);
          if (source.origin !== window.location.origin || !source.pathname.startsWith('/assets/')) return;
          try {
            if (Date.now() - Number(sessionStorage.getItem(retryKey) || 0) < 60000) { showRecovery(); return; }
            sessionStorage.setItem(retryKey, String(Date.now()));
          } catch (_) { showRecovery(); return; }
          const freshUrl = new URL(window.location.href);
          freshUrl.searchParams.set('_pf_reload', String(Date.now()));
          window.location.replace(freshUrl.toString());
        }, true);
        window.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root');
          if (!root) return;
          const observer = new MutationObserver(() => {
            if (!hasStarted()) return;
            observer.disconnect();
            try { sessionStorage.removeItem(retryKey); } catch (_) { /* Storage may be disabled. */ }
          });
          observer.observe(root, { childList: true });
          setTimeout(() => { observer.disconnect(); showRecovery(); }, 20000);
        });
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#15171e',
              nocturne: '#120a0b',
              cotton:   '#E4E1DC',
              tranquil: '#129DC0',
            },
            fontFamily: {
              sans: ['var(--font-family)', 'sans-serif'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              pageEntry: {
                '0%':   { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleIn: {
                '0%':   { opacity: '0', transform: 'scale(0.97)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
            },
            animation: {
              'fade-in':    'fadeIn 0.3s ease-out',
              'slide-up':   'slideUp 0.4s ease-out',
              'slide-down': 'slideDown 0.4s ease-out',
              'page-entry': 'pageEntry 0.2s ease-out',
              'scale-in':   'scaleIn 0.2s ease-out',
            }
          }
        }
      }
    </script>

<style>
  :root {
    --color-brand: #2563eb; /* Fallback */
    --font-family: ui-sans-serif, system-ui, sans-serif;
  }
  
  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent; 
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1; 
    border-radius: 4px;
  }
  .dark ::-webkit-scrollbar-track {
    background: #15171e;
  }
  .dark ::-webkit-scrollbar-thumb {
    background: #2b2d3b;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8; 
  }
  .dark ::-webkit-scrollbar-thumb:hover {
    background: #3e4152;
  }

  /* Utility to hide scrollbar but allow scrolling */
  .scrollbar-hide::-webkit-scrollbar {
      display: none;
  }
  .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
  }

  /* Smooth inputs */
  input, select, textarea {
    transition: border-color 0.2s, box-shadow 0.2s;
  }
</style>

</head>
  <body class="bg-gray-50 dark:bg-[#15171e] text-slate-700 dark:text-slate-200 antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
